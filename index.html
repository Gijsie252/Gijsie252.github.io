<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- AANPASSEN: titel van je website -->
    <title>Mijn Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background-color: #eee9e9;
            color: #444;
        }

        /* =========================
           NAVIGATIE
        ========================= */

        header {
            width: 100%;
            padding: 30px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo h1 {
            font-size: 28px;
            color: #444;
        }

        .logo p {
            font-family: Arial, sans-serif;
            font-size: 12px;
            margin-top: 3px;
        }

        nav a {
            text-decoration: none;
            color: #777;
            font-family: Arial, sans-serif;
            font-size: 11px;
            margin-left: 25px;
        }

        nav a:hover {
            color: #e72d55;
        }


        /* =========================
           HOOFDGEDEELTE
        ========================= */

        .hero {
            max-width: 950px;
            margin: 30px auto 70px;
            padding: 0 30px;

            display: flex;
            align-items: center;
            gap: 50px;
        }


        /* =========================
           FOTO
        ========================= */

        .profile-image {
            width: 230px;
            height: 230px;

            border-radius: 50%;
            object-fit: cover;

            /* AANPASSEN:
               Zet hier je eigen foto */
            background-color: #ccc;
        }


        /* =========================
           TEKST
        ========================= */

        .hero-text {
            flex: 1;
        }

        .hero-text h2 {
            font-size: 48px;
            margin-bottom: 5px;
            color: #444;
        }

        .hero-text h3 {
            font-size: 27px;
            font-weight: normal;
            margin-bottom: 18px;
        }

        .hero-text p {
            font-family: Arial, sans-serif;
            font-size: 13px;
            line-height: 1.6;
            max-width: 430px;
            margin-top: 15px;
        }


        /* =========================
           RONDE KNOPPEN
        ========================= */

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .circle {
            width: 78px;
            height: 78px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            text-decoration: none;
            color: white;

            font-family: Arial, sans-serif;
            font-size: 9px;
            text-align: center;
        }

        .button1 {
            background-color: #e72d55;
        }

        .button2 {
            background-color: #55c5ce;
        }

        .button3 {
            background-color: #d2ca19;
        }

        .circle:hover {
            transform: scale(1.08);
            transition: 0.2s;
        }


        /* =========================
           VOETTEKST
        ========================= */

        footer {
            background-color: #e72d55;
            color: white;

            min-height: 90px;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 70px;

            font-family: Arial, sans-serif;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-icon {
            width: 35px;
            height: 35px;

            border-radius: 50%;

            background-color: #55c5ce;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 17px;
        }

        .footer-text {
            font-size: 10px;
            line-height: 1.5;
        }


        /* =========================
           MOBIEL
        ========================= */

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            nav a {
                margin: 0 8px;
            }

            .hero {
                flex-direction: column;
                text-align: center;
                margin-top: 20px;
            }

            .hero-text p {
                margin-left: auto;
                margin-right: auto;
            }

            .buttons {
                justify-content: center;
            }

            footer {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         BOVENSTE GEDEELTE
    ========================= -->

    <header>

        <div class="logo">

            <!-- AANPASSEN -->
            <h1>GIJS PONGERS</h1>

            <!-- AANPASSEN -->
            <p>Ik ben 14 jaar oud en ik zit op het VLC</p>

        </div>


        <nav>

            <!-- AANPASSEN -->
            <a href="#">HOME</a>
            <a href="#">OVER MIJ</a>
            <a href="#">AI</a>
            <a href="#">CONTACT</a>

        </nav>

    </header>



    <!-- =========================
         HOOFDGEDEELTE
    ========================= -->

    <main>

        <section class="hero">


            <!-- FOTO -->

            <div class="profile-image">

                <!--
                FOTO TOEVOEGEN:

                Zet bijvoorbeeld een afbeelding
                genaamd "foto.jpg" in dezelfde map.

                Voeg daarna in .profile-image toe:

                background-image: url("foto.jpg");
                background-size: cover;
                background-position: center;
                -->

            </div>



            <!-- TEKST -->

            <div class="hero-text">

                <!-- AANPASSEN -->
                <h2>Hallo,</h2>

                <!-- AANPASSEN -->
                <h3>een beetje over mij:</h3>


                <div class="buttons">

                    <!-- AANPASSEN -->
                    <a href="#" class="circle button1">
                        OVER MIJ
                    </a>

                    <!-- AANPASSEN -->
                    <a href="#" class="circle button2">
                        HOBBY'S
                    </a>

                    <!-- AANPASSEN -->
                    <a href="#" class="circle button3">
                        MIJN WERK
                    </a>

                </div>


                <!-- AANPASSEN -->
                <p>
                    Ik ben Gijs,
                    ik hou van sport en zit op het vlietlandcollege
                </p>

            </div>

        </section>

    </main>



    <!-- =========================
         ONDERSTE GEDEELTE
    ========================= -->

    <footer>


        <div class="footer-item">

            <div class="footer-icon">
                ☎
            </div>

            <div class="footer-text">
                <strong>TELEFOON</strong><br>
                06-123...
            </div>

        </div>



        <div class="footer-item">

            <div class="footer-icon">
                ✉
            </div>

            <div class="footer-text">
                <strong>E-MAIL</strong><br>
                Gijs.pongers@vlietlandcollege.nl
            </div>

        </div>



        <div class="footer-item">

            <div class="footer-icon">
                +
            </div>

            <div class="footer-text">
                <strong>SOCIALE MEDIA</strong><br>
                @gijsie_cc TIKTOK
            </div>

        </div>


    </footer>


</body>
</html>
